name: Start Workflow

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - 'out/**'

permissions:
  contents: write   # commit the regenerated README/image
  actions: write    # keepalive: re-enable this workflow so it is never auto-disabled

concurrency:
  group: readme-refresh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run update script
      env:
        # The built-in token is enough for public profile data and never expires.
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_USER: ${{ github.repository_owner }}
      run: python main.py

    - name: Commit and push changes
      run: |
        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        git add README.md out/fetch.png
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "Update README"
          # Another run may have pushed meanwhile; replay this commit on top.
          git pull --rebase -X theirs origin main
          git push
        fi

    - name: Keep scheduled workflow alive
      # GitHub disables scheduled workflows after 60 days without repo activity.
      # Re-enabling via the API resets that timer even when nothing changed.
      if: github.event_name == 'schedule'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/build.yaml/enable"
